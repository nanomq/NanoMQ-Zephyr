# NanoMQ → Zephyr broker demo configuration
#
# Baseline: demo/zephyr_mqtt/prj.conf in NanoNNG (proven on qemu_x86),
# with resource sizing bumped for the broker and SLIRP hostfwd added
# so the host can reach the guest broker on tcp:1883.

# POSIX API — provides pthread, sockets, poll (Zephyr pthread stack comes
# from the dynamic thread pool: DYNAMIC_THREAD_STACK_SIZE below)
CONFIG_POSIX_API=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
# Zephyr POSIX objects come from fixed pools.  nng maps its mutex/condvar
# onto pthread_* , and nni_plat_{mtx,cv}_init RETRY FOREVER when the pool
# is exhausted (nng/src/platform/zephyr/zephyr_thread.c) — an exhausted
# pool stalls the calling thread invisibly (observed: broker boot with
# REST+webhook reaches a 245/256 mutex baseline, then the REST
# inproc_server thread hangs forever in nng_rep0_open trying to grab the
# 246th).  nng's dynamic model (mutex per sock/ctx/aio/work, webhook
# pool_size=32 works x 2 aios each) does not fit small fixed pools, so
# budget generously: 1024 slots cost only ~30 KB of static arrays.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=1024
CONFIG_MAX_PTHREAD_COND_COUNT=1024
CONFIG_MAX_PTHREAD_RWLOCK_COUNT=32
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_POLL=y
# Zephyr's zvfs_poll() maps the whole poll() fd set onto ONE shared array
# of k_poll_event's, bounded by CONFIG_ZVFS_POLL_MAX (Kconfig default 3!).
# nng's pollq puts every armed socket into a single poll() call (wake
# "pipe" is a dummy fd that consumes no slot), so the broker needs one
# slot per listener/connection direction: 2 listeners + 2 connections
# already exceeds the default and zvfs_poll then returns -1/ENOMEM on
# every call (nng's pollq would busy-spin and starve all I/O — see
# zephyr_pollq_poll.c error handling).  Budget for the demo scale:
# 2 listeners + up to ~6 concurrent MQTT/webhook conns x 2 directions.
CONFIG_ZVFS_POLL_MAX=16

# Networking — broker listens on TCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# DNS (not strictly needed by the broker, kept for completeness)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2

# QEMU user-mode networking with host forward.
# Bind 0.0.0.0: the "host" of SLIRP is the docker container running qemu;
# binding all container interfaces lets the outer host reach the guest
# broker via the container IP (bridge network).
#   container tcp:1883  ->  guest 10.0.2.15:1883 (broker listen address)
CONFIG_NET_QEMU_USER=y
CONFIG_NET_QEMU_USER_EXTRA_ARGS="hostfwd=tcp:0.0.0.0:1883-:1883,hostfwd=tcp:0.0.0.0:8081-:8081"

# e1000 driver for the qemu_x86 "eth0" node — NET_QEMU_USER only implies
# the Ethernet L2; without the driver there is no real NIC (net_config
# would have put 10.0.2.15 on the loopback iface and SLIRP frames would
# never be received).
CONFIG_ETH_E1000=y

# Static guest IP — SLIRP only forwards to 10.0.2.15 (its fixed notion of
# the guest); without an address on the interface the guest drops every
# forwarded SYN at the IP layer.  net_config applies it in an APPLICATION
# SYS_INIT (before main), so the broker's listen is reachable by the time
# the demo starts.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.2"
CONFIG_NET_CONFIG_AUTO_INIT=y

# Memory and stack sizing — the broker heap holds nng taskq/poller
# threads, work structs, MQTT messages and the nanolib session db.
# Tune CONFIG_HEAP_MEM_POOL_SIZE / *STACK* when enlarging conf->parallel.
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_MAIN_STACK_SIZE=16384

# nng's Zephyr platform alloc is plain malloc() (zephyr_alloc.c), so the
# libc malloc arena IS the broker heap.  With MMU enabled (qemu_x86's
# default) COMMON_LIBC_MALLOC_ARENA_SIZE defaults to a mere 16384 and
# larger allocations (e.g. per-pipe rlmq resize of msq_len*8 bytes) fail;
# the CONFIG_HEAP_MEM_POOL_SIZE pool above serves k_malloc() only and is
# not used by nng.  Size the arena for the broker workload explicitly.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# Enable FPU so the SSE/SSE2/SSE3/SSSE3 Kconfig options become visible
CONFIG_FPU=y

# CPU instruction sets up to what the emulated CPU (qemu32, CPU_ATOM)
# provides: MMX/SSE/SSE2/SSE3.  SSSE3 must NOT be enabled — qemu32 and
# Zephyr's CPU_ATOM model lack it (Kconfig drops the assignment to n and
# the build aborts on the warning).
CONFIG_X86_SSE=y
CONFIG_X86_SSE2=y
CONFIG_X86_SSE3=y

# Networking buffers — bumped for broker pub/sub forwarding
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_PRINTK=y

# Debug: bump NanoMQ log level to DEBUG (remove for normal runs)
CONFIG_BROKER_LOG_DEBUG=y

# NanoMQ HTTP REST API — conf http_server.enable + NONE_AUTH override in
# main.c (Kconfig BROKER_REST_API).  Served on the tcp:8081 hostfwd above;
# conf_init defaults http_server.enable to false, so without this switch
# the guest has no listener on 8081 and SLIRP answers RST.
CONFIG_BROKER_REST_API=y

# NanoMQ webhook forwarder — conf web_hook.enable + inproc hook channel +
# MESSAGE_PUBLISH("test/#") / CLIENT_CONNACK rules in main.c (Kconfig
# BROKER_WEBHOOK).  Event POSTs go to the QEMU-host alias 10.0.2.2.
CONFIG_BROKER_WEBHOOK=y
